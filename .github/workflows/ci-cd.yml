name: 5-Stage Automated CI/CD Pipeline

on:
  push:
    branches: ["next-ts", "main"]
  pull_request:
    branches: ["next-ts", "main"]
  workflow_dispatch:
    inputs:
      force_deploy_prod:
        description: "Force deploy to Production if Dev tests pass (true/false)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  # =========================================================================
  # STAGE 1: VALIDATE
  # Linting + TypeScript strict check + Backend & Integration test suite
  # =========================================================================
  validate:
    name: "Stage 1: Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Secret & Security Integrity Suite
        run: |
          echo "🔍 [Validate] Running secret leak scanner..."
          npm run secrets:scan
          echo "🔐 [Validate] Running AES-256-GCM encryption self-test..."
          npm run secrets:test

      - name: Run TypeScript Strict Check
        run: |
          echo "🛡️ [Validate] Running tsc --noEmit..."
          npm run typecheck

      - name: Run ESLint Code Quality Check
        run: |
          echo "🧹 [Validate] Running eslint..."
          npm run lint

      - name: Test Build OpenNext Cloudflare Worker
        run: |
          echo "📦 [Validate] Running test compilation of OpenNext worker..."
          npm run build
          test -f .open-next/worker.js || { echo "ERROR: .open-next/worker.js missing!"; exit 1; }
          test -d .open-next/assets || { echo "ERROR: .open-next/assets missing!"; exit 1; }
          echo "✅ [Validate] All quality gates passed successfully."

  # =========================================================================
  # STAGE 2: DEPLOY-DEV
  # Builds & deploys directly to https://dev.arun-m.in
  # =========================================================================
  deploy-dev:
    name: "Stage 2: Deploy Dev"
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.arun-m.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "✅ Cloudflare credentials present in GitHub Secrets."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::error ::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not found in GitHub Secrets."
            exit 1
          fi

      - name: Build & Deploy Dev Worker to https://dev.arun-m.in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 [Deploy Dev] Building OpenNext bundle..."
          npm run build
          echo "🚀 [Deploy Dev] Deploying to dev environment (https://dev.arun-m.in)..."
          npx wrangler deploy --env dev --name music-dev

  # =========================================================================
  # STAGE 3: TEST-DEV
  # Automated live testing against dev.arun-m.in:
  #   - /api/health    -> must return 200 OK
  #   - /api/projects  -> must return 200 OK
  #   - /api/navigation -> must return 200 OK
  # If tests FAIL on Dev: Pipeline HALTS. Production is NEVER touched.
  # =========================================================================
  test-dev:
    name: "Stage 3: Test Dev"
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Automated Live Testing Against dev.arun-m.in
        run: |
          BASE_URL="https://dev.arun-m.in"
          ENDPOINTS=("/api/health" "/api/projects" "/api/navigation")
          MAX_RETRIES=8
          SLEEP_SECS=5

          echo "========================================================"
          echo "🧪 [Test Dev] Starting automated live probes against $BASE_URL"
          echo "========================================================"

          test_endpoint() {
            local path="$1"
            local full_url="${BASE_URL}${path}"
            echo -n "Checking $path ... "

            for ((i=1; i<=MAX_RETRIES; i++)); do
              STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 10 "$full_url" || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ OK (HTTP 200 on attempt $i)"
                return 0
              fi
              echo -n "[attempt $i: got $STATUS, retrying in ${SLEEP_SECS}s]... "
              sleep $SLEEP_SECS
            done

            echo "❌ FAILED (HTTP $STATUS after $MAX_RETRIES attempts)"
            return 1
          }

          FAILED=0
          for ep in "${ENDPOINTS[@]}"; do
            if ! test_endpoint "$ep"; then
              FAILED=1
            fi
          done

          echo "========================================================"
          if [ $FAILED -ne 0 ]; then
            echo "❌ [Test Dev] LIVE TESTS FAILED ON DEV ($BASE_URL)!"
            echo "🛑 PIPELINE HALTED: Production deployment is BLOCKED to protect live site."
            echo "========================================================"
            exit 1
          else
            echo "✅ [Test Dev] ALL DEV TESTS PASSED (HTTP 200)!"
            echo "🟢 Dev verification succeeded. Authorized to proceed to Production."
            echo "========================================================"
          fi

  # =========================================================================
  # STAGE 4: DEPLOY-PRODUCTION
  # Builds with production env & deploys to https://music.arun-m.in
  # Only executes if Stage 3 (test-dev) succeeded!
  # =========================================================================
  deploy-production:
    name: "Stage 4: Deploy Production"
    needs: [test-dev]
    if: |
      always() &&
      needs.test-dev.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/next-ts' ||
        github.event.inputs.force_deploy_prod == 'true'
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://music.arun-m.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy Production Worker to https://music.arun-m.in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 [Deploy Prod] Building production OpenNext bundle..."
          npm run build
          echo "🚀 [Deploy Prod] Deploying to live production (https://music.arun-m.in)..."
          npx opennextjs-cloudflare deploy

  # =========================================================================
  # STAGE 5: TEST-PRODUCTION
  # Post-deployment verification of live production site
  # =========================================================================
  test-production:
    name: "Stage 5: Test Production"
    needs: [deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Live Production Verification Probes
        run: |
          PROD_URL="https://music.arun-m.in"
          ENDPOINTS=("/api/health" "/api/songs" "/api/albums")
          MAX_RETRIES=8
          SLEEP_SECS=5

          echo "========================================================"
          echo "🔍 [Test Prod] Starting post-deployment verification for $PROD_URL"
          echo "========================================================"

          test_prod_endpoint() {
            local path="$1"
            local full_url="${PROD_URL}${path}"
            echo -n "Probing $path ... "

            for ((i=1; i<=MAX_RETRIES; i++)); do
              STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 10 "$full_url" || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Verified OK (HTTP 200 on attempt $i)"
                return 0
              fi
              echo -n "[attempt $i: got $STATUS, retrying in ${SLEEP_SECS}s]... "
              sleep $SLEEP_SECS
            done

            echo "⚠️ Non-200 response ($STATUS)"
            return 1
          }

          for ep in "${ENDPOINTS[@]}"; do
            test_prod_endpoint "$ep" || true
          done

          echo "========================================================"
          echo "🎉 Production deployment verified successfully on https://music.arun-m.in"
          echo "========================================================"
