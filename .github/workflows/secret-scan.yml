name: Secret scan

# Prevents the class of leak recorded as R-1 in SECURITY-REPORT.md: a credential
# committed to the repository. The scan is dependency-free (`node scripts/secrets.mjs`
# only uses Node built-ins), so it adds a few seconds to a pull request.
#
# It cannot make a leaked credential safe again - rotation does that. It stops
# the next leak from reaching the remote.

on:
  push:
    branches: ["next-ts"]
  pull_request:
    branches: ["next-ts"]
  schedule:
    # Weekly full history sweep (the pull-request run only sees the working tree).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  working-tree:
    name: Working tree
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Scan tracked and staged files
        run: node scripts/secrets.mjs scan
      - name: Secrets encryption self-test
        run: node scripts/secrets.mjs test

  history:
    name: Git history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan every commit
        run: node scripts/secrets.mjs scan --history
